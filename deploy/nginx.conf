# /etc/nginx/sites-available/kfr
# Reverse-proxy config for keralafirstresponder.org
# Serves the built React frontend + proxies /api/* to the FastAPI backend on :8001.

server {
    listen 80;
    server_name keralafirstresponder.org www.keralafirstresponder.org;

    # Redirect www -> apex (comment out this block if you prefer www as primary)
    if ($host = www.keralafirstresponder.org) {
        return 301 https://keralafirstresponder.org$request_uri;
    }

    # Certbot will inject SSL config here on first run.

    client_max_body_size 25M;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # ---- Frontend (built React app) ----
    root /home/kfr/app/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed CRA assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- Backend API ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
